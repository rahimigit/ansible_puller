name: test
on:
  # automatic triggers removed 2026-10-30 to stop burning hosted-runner minutes; run manually
  workflow_dispatch:

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: bazelbuild/setup-bazelisk@v2
      - name: Mount bazel cache
        uses: actions/cache@v3
        with:
          path: "~/.cache/bazel"
          key: ${{ runner.os }}-bazel-cache
      - run: bazel build //...
      - run: bazel test //...